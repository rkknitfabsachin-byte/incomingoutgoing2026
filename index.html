<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gate Pass Entry</title>

<style>
body {
  margin: 0;
  font-family: system-ui, sans-serif;
  background: #f2f4f8;
}

/* TOP BAR */
.top {
  display: flex;
  gap: 10px;
  padding: 12px;
  background: #0f172a;
}
.top select, .top input {
  flex: 1;
  padding: 12px;
  font-size: 16px;
  border-radius: 12px;
  border: none;
}

/* CARD */
.card {
  background: white;
  margin: 12px;
  padding: 14px;
  border-radius: 16px;
  box-shadow: 0 8px 20px rgba(0,0,0,.08);
}
.card label {
  font-size: 12px;
  color: #64748b;
}
.card input, .card select {
  width: 100%;
  margin-top: 4px;
  margin-bottom: 10px;
  padding: 12px;
  font-size: 16px;
  border-radius: 10px;
  border: 1px solid #cbd5e1;
}

/* BUTTONS */
.add {
  margin: 12px;
  padding: 16px;
  width: calc(100% - 24px);
  font-size: 18px;
  border-radius: 14px;
  background: #2563eb;
  color: white;
  border: none;
}
.save {
  margin: 12px;
  padding: 18px;
  width: calc(100% - 24px);
  font-size: 20px;
  border-radius: 16px;
  background: #16a34a;
  color: white;
  border: none;
}
.remove {
  background: #dc2626;
  color: white;
  padding: 10px;
  border-radius: 10px;
  border: none;
  width: 100%;
}
</style>
</head>

<body>

<!-- TOP -->
<div class="top">
  <select id="category">
    <option value="OUTGOING">📤 OUTGOING</option>
    <option value="INCOMING">📥 INCOMING</option>
  </select>
  <input type="date" id="date">
</div>

<div id="cards"></div>

<button class="add" onclick="addCard()">➕ Add Entry</button>
<button class="save" onclick="saveAll()">💾 SAVE ALL</button>

<script>
const API = "https://script.google.com/macros/s/AKfycbyfrmKuiVPdhAEX9FB9I27Dr2TaP7BQrUMA4cG9iNjHIyIL4xaBOMfc0EUWpMxGSo5Z/exec"; // 👈 replace
let master = {};

date.value = new Date().toISOString().slice(0,10);

/* LOAD MASTER */
fetch(`${API}?action=master`)
  .then(r=>r.json())
  .then(d=>{
    master=d;
    addCard();
  });

function addCard() {
  const div = document.createElement("div");
  div.className = "card";
  div.innerHTML = `
    <label>Gate Pass No.</label>
    <input placeholder="Optional">

    <label>Party</label>
    ${dd(master.party)}

    <label>Particulars</label>
    ${dd(master.particulars)}

    <label>Quantity</label>
    <input type="number" placeholder="Qty">

    <label>Vehicle</label>
    ${dd(master.vehicle)}

    <label>Time</label>
    <input type="time">

    <button class="remove" onclick="this.parentElement.remove()">❌ Remove</button>
  `;
  cards.appendChild(div);
}

function dd(arr=[]) {
  return `<select>${arr.map(v=>`<option>${v}</option>`).join("")}</select>`;
}

function saveAll() {
  const list = [...document.querySelectorAll(".card")];
  const entries = list.map(c=>{
    const f = c.querySelectorAll("input,select");
    return {
      gatePass: f[0].value,
      party: f[1].value,
      particular: f[2].value,
      qty: f[3].value,
      vehicle: f[4].value,
      time: f[5].value
    };
  }).filter(e=>e.qty);

  if(!entries.length){ alert("No entries"); return; }

  const payload = encodeURIComponent(JSON.stringify({
    category: category.value,
    date: date.value,
    defaultTime: new Date().toTimeString().slice(0,5),
    entries
  }));

  fetch(`${API}?action=save&payload=${payload}`)
    .then(r=>r.json())
    .then(res=>{
      alert(`✅ Saved ${res.saved}`);
      cards.innerHTML="";
      addCard();
    });
}
</script>

</body>
</html>
