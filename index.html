<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gate Pass Entry</title>

<style>
body{
  margin:0;
  font-family: system-ui, sans-serif;
  background:#eef2f7;
}

/* TOP BAR */
.top{
  display:flex;
  gap:10px;
  padding:12px;
  background:#0f172a;
}
.top select,.top input{
  flex:1;
  padding:14px;
  font-size:16px;
  border-radius:14px;
  border:none;
}

/* CARD */
.card{
  background:white;
  margin:12px;
  padding:16px;
  border-radius:18px;
  box-shadow:0 10px 24px rgba(0,0,0,.08);
  animation:fade .2s ease;
}
@keyframes fade{from{opacity:0;transform:scale(.98)}to{opacity:1}}

label{
  font-size:12px;
  color:#64748b;
}
.card input{
  width:100%;
  margin:6px 0 12px;
  padding:14px;
  font-size:16px;
  border-radius:12px;
  border:1px solid #cbd5e1;
}

/* BUTTONS */
.add,.save{
  margin:12px;
  width:calc(100% - 24px);
  border:none;
  border-radius:18px;
  color:white;
}
.add{
  padding:16px;
  font-size:18px;
  background:#2563eb;
}
.save{
  padding:18px;
  font-size:20px;
  background:#16a34a;
}
.remove{
  width:100%;
  padding:12px;
  border:none;
  border-radius:12px;
  background:#dc2626;
  color:white;
}
</style>
</head>

<body>

<!-- TOP -->
<div class="top">
  <select id="category">
    <option value="OUTGOING">📤 OUTGOING</option>
    <option value="INCOMING">📥 INCOMING</option>
  </select>
  <input type="date" id="date">
</div>

<!-- DATALISTS -->
<datalist id="partyList"></datalist>
<datalist id="particularList"></datalist>
<datalist id="vehicleList"></datalist>

<div id="cards"></div>

<button class="add" onclick="addCard()">➕ Add Entry</button>
<button class="save" onclick="saveAll()">💾 SAVE ALL</button>

<script>
const API = "https://script.google.com/macros/s/AKfycbyfrmKuiVPdhAEX9FB9I27Dr2TaP7BQrUMA4cG9iNjHIyIL4xaBOMfc0EUWpMxGSo5Z/exec"; // 👈 replace
let master = {};

date.value = new Date().toISOString().slice(0,10);

/* LOAD MASTER DATA */
fetch(`${API}?action=master`)
  .then(r=>r.json())
  .then(d=>{
    master=d;
    fillList("partyList",d.party);
    fillList("particularList",d.particulars);
    fillList("vehicleList",d.vehicle);
    addCard();
  });

function fillList(id,arr){
  document.getElementById(id).innerHTML =
    arr.map(v=>`<option value="${v}">`).join("");
}

/* ADD CARD */
function addCard(){
  const c=document.createElement("div");
  c.className="card";
  c.innerHTML=`
    <label>Gate Pass No.</label>
    <input placeholder="Optional">

    <label>Party (Search / Type)</label>
    <input list="partyList" placeholder="Type to search or add">

    <label>Particulars</label>
    <input list="particularList" placeholder="Type to search or add">

    <label>Quantity</label>
    <input type="number" placeholder="Qty">

    <label>Vehicle</label>
    <input list="vehicleList" placeholder="Type to search or add">

    <label>Time</label>
    <input type="time">

    <button class="remove" onclick="this.parentElement.remove()">❌ Remove</button>
  `;
  cards.appendChild(c);
}

/* SAVE */
function saveAll(){
  const list=[...document.querySelectorAll(".card")];
  const entries=list.map(c=>{
    const f=c.querySelectorAll("input");
    return{
      gatePass:f[0].value,
      party:f[1].value,
      particular:f[2].value,
      qty:f[3].value,
      vehicle:f[4].value,
      time:f[5].value
    };
  }).filter(e=>e.qty);

  if(!entries.length){alert("No entries");return;}

  const payload=encodeURIComponent(JSON.stringify({
    category:category.value,
    date:date.value,
    defaultTime:new Date().toTimeString().slice(0,5),
    entries
  }));

  fetch(`${API}?action=save&payload=${payload}`)
    .then(r=>r.json())
    .then(res=>{
      alert(`✅ Saved ${res.saved} entries`);
      cards.innerHTML="";
      addCard();
    });
}
</script>

</body>
</html>
