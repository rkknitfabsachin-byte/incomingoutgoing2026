<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gate Pass Bulk Entry</title>

<style>
body { font-family: system-ui; margin:0; background:#f4f6fb; }
header {
  display:flex; gap:8px; padding:10px;
  background:#0f172a; color:white;
}
input, select {
  padding:10px; font-size:16px; width:100%;
}
table { width:100%; }
td { padding:4px; }
button {
  padding:14px; font-size:16px;
  border:none; border-radius:8px;
}
.add { background:#2563eb; color:white; }
.save { background:#16a34a; color:white; width:100%; }
.remove { background:#dc2626; color:white; }
footer {
  position:sticky; bottom:0;
  background:white; padding:10px;
}
</style>
</head>

<body>

<header>
  <select id="category">
    <option value="OUTGOING">📤 OUTGOING</option>
    <option value="INCOMING">📥 INCOMING</option>
  </select>
  <input type="date" id="date">
</header>

<table>
  <tbody id="rows"></tbody>
</table>

<button class="add" onclick="addRow()">➕ Add Row</button>

<footer>
  <button class="save" onclick="saveAll()">💾 SAVE ALL</button>
</footer>

<script>
/************ CONFIG ************/
const API = "https://script.google.com/macros/s/AKfycbyfrmKuiVPdhAEX9FB9I27Dr2TaP7BQrUMA4cG9iNjHIyIL4xaBOMfc0EUWpMxGSo5Z/exec"; // 👈 paste URL

let master = {};

document.getElementById("date").value =
  new Date().toISOString().slice(0,10);

/************ LOAD MASTER ************/
fetch(API + "?action=master", { method:"POST" })
  .then(r => r.json())
  .then(d => {
    master = d;
    addRow();
  });

function addRow() {
  const tr = document.createElement("tr");
  tr.innerHTML = `
    <td><input placeholder="Gate Pass"></td>
    <td>${select(master.party)}</td>
    <td>${select(master.particulars)}</td>
    <td><input type="number" placeholder="Qty"></td>
    <td>${select(master.vehicle)}</td>
    <td><input type="time"></td>
    <td><button class="remove" onclick="this.closest('tr').remove()">✖</button></td>
  `;
  document.getElementById("rows").appendChild(tr);
}

function select(arr) {
  return `<select>${arr.map(v=>`<option>${v}</option>`).join("")}</select>`;
}

/************ SAVE ************/
function saveAll() {
  const trs = [...document.querySelectorAll("#rows tr")];

  const entries = trs.map(r => {
    const c = r.querySelectorAll("input,select");
    return {
      gatePass: c[0].value,
      party: c[1].value,
      particular: c[2].value,
      qty: c[3].value,
      vehicle: c[4].value,
      time: c[5].value
    };
  }).filter(e => e.qty);

  fetch(API + "?action=save", {
    method:"POST",
    body: JSON.stringify({
      category: category.value,
      date: date.value,
      defaultTime: new Date().toTimeString().slice(0,5),
      entries
    })
  })
  .then(r=>r.json())
  .then(res=>{
    alert(`✅ Saved ${res.saved} entries`);
    rows.innerHTML="";
    addRow();
  });
}
</script>

</body>
</html>
